version: '3'
services:
  redis:
    image: redis
    restart: "no"
    networks:
      - default
    environment:
      TZ: "Asia/Shanghai"

  mysql:
    image: mysql:8.0
    restart: "no"
    networks:
      - default
    environment:
      MYSQL_DATABASE: wvp
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: wvp_user
      MYSQL_PASSWORD: wvp_password
      TZ: Asia/Shanghai
    volumes:
      - ./volumes/mysql/data:/var/lib/mysql
    command: [
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_general_ci',
      '--default-time-zone=+8:00',
      '--lower-case-table-names=1'
    ]

  wvp:
    build:
      context: ./wvp
    restart: "no"
    ports:
      - "15060:5060"
      - "15060:5060/udp"
      - "18080:18080"
      - "10000:10000/tcp"
      - "10000:10000/udp"
      - "30000-30500:30000-30500/tcp"
      - "30000-30500:30000-30500/udp"
      - "8001:8001"
      - "18000:18000/udp"
      - "18000:18000/tcp"
      - "13000:13000/tcp"
      - "13001:13001/tcp"
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./video:/opt/media/www/record/
      - ./logs/wvp:/opt/wvp/logs/
      - ./logs/assist:/opt/assist/logs/
      - ./logs/media:/opt/media/log/
      - ./wvp-config-fixed.yml:/opt/wvp/config/application.yml
      - ./zlm-config-fixed.ini:/opt/media/config.ini
    environment:
      TZ: "Asia/Shanghai"
      WVP_HOST: 120.196.238.83
      WVP_PWD: sss168312
      WVP_DOMAIN: "4401020049"
      WVP_ID: "34020000002000000001"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USER: wvp_user
      DATABASE_PASSWORD: wvp_password
    depends_on:
      - redis
      - mysql
